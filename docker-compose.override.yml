# Desenvolvimento (aplicado automaticamente pelo "docker compose up").
# Código montado como volume + recarga automática ao salvar arquivos.
services:
  app:
    build:
      context: .
      args:
        INSTALAR_DEV: "true"
    environment:
      APP_CONFIG: development
    command: ["flask", "run", "--host", "0.0.0.0", "--port", "8000", "--debug"]
    volumes:
      - .:/app
    ports:
      - "${APP_PORT:-8000}:8000"

  db:
    ports:
      - "${DB_PORT:-5432}:5432"
