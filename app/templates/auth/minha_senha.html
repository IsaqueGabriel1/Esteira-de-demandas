{% extends "base.html" %}
{% from "partials/_macros.html" import campo %}
{% block titulo %}Alterar senha{% endblock %}
{% block conteudo %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-4">
    <h1 class="h4 mb-3">Alterar senha</h1>
    <div class="card"><div class="card-body">
      <form method="post" novalidate>
        {{ form.hidden_tag() }}
        {{ campo(form.senha_atual) }}
        {{ campo(form.nova_senha) }}
        {{ campo(form.confirmacao) }}
        <button class="btn btn-primary">Salvar</button>
        <a href="{{ url_for('demandas.quadro') }}" class="btn btn-link">Cancelar</a>
      </form>
    </div></div>
  </div>
</div>
{% endblock %}
