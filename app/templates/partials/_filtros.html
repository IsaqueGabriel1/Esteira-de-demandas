{# Barra de filtros compartilhada entre quadro e lista. Variáveis: filtros, eixos, usuarios, mostrar_status #}
<form method="get" class="card card-body filtros mb-3 py-2">
  <div class="row g-2 align-items-end">
    <div class="col-md-3">
      <label class="form-label small mb-0">Buscar</label>
      <input type="search" name="busca" value="{{ filtros.busca }}" class="form-control form-control-sm" placeholder="Ação, produto ou #id">
    </div>
    <div class="col-md-2">
      <label class="form-label small mb-0">Eixo</label>
      <select name="eixo" class="form-select form-select-sm">
        <option value="">Todos</option>
        {% for eixo in eixos %}
        <option value="{{ eixo.id }}" {{ 'selected' if filtros.eixo_id == eixo.id }}>{{ eixo.rotulo }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="col-md-2">
      <label class="form-label small mb-0">Responsável</label>
      <select name="responsavel" class="form-select form-select-sm">
        <option value="">Todos</option>
        {% for u in usuarios %}
        <option value="{{ u.id }}" {{ 'selected' if filtros.atribuido_id == u.id }}>{{ u.nome }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="col-md-2">
      <label class="form-label small mb-0">Prioridade</label>
      <select name="faixa" class="form-select form-select-sm">
        <option value="">Todas</option>
        {% for _min, _max, rotulo, css in FAIXAS_GUT|reverse %}
        <option value="{{ css }}" {{ 'selected' if filtros.faixa == css }}>{{ rotulo }} ({{ _min }}–{{ _max }})</option>
        {% endfor %}
        <option value="pendente" {{ 'selected' if filtros.faixa == 'pendente' }}>Aguardando priorização</option>
      </select>
    </div>
    {% if mostrar_status %}
    <div class="col-md-1">
      <label class="form-label small mb-0">Status</label>
      <select name="status" class="form-select form-select-sm">
        <option value="">Todos</option>
        {% for s in Status.TODOS %}
        <option value="{{ s }}" {{ 'selected' if filtros.status == s }}>{{ Status.rotulo(s) }}</option>
        {% endfor %}
      </select>
    </div>
    {% endif %}
    <div class="col-auto">
      <div class="form-check form-switch mb-1">
        <input class="form-check-input" type="checkbox" name="atrasadas" value="1" id="f-atrasadas" {{ 'checked' if filtros.atrasadas }}>
        <label class="form-check-label small" for="f-atrasadas">Só atrasadas</label>
      </div>
      {% if mostrar_status %}
      <div class="form-check form-switch mb-1">
        <input class="form-check-input" type="checkbox" name="canceladas" value="1" id="f-canceladas" {{ 'checked' if request.args.get('canceladas') == '1' }}>
        <label class="form-check-label small" for="f-canceladas">Incluir canceladas</label>
      </div>
      {% endif %}
    </div>
    <div class="col-auto ms-auto">
      <button class="btn btn-sm btn-primary"><i class="bi bi-funnel"></i> Filtrar</button>
      <a href="{{ request.path }}" class="btn btn-sm btn-outline-secondary">Limpar</a>
    </div>
  </div>
</form>
